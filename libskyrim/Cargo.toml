[package]
name = "libskyrim"
version = "1.1.0"
edition = "2024"

[dependencies]
core-util = { path = "../core-util" }
cstd = { path = "../cstd" }
libskyrim-macros = { path = "../libskyrim-macros" }
bitflags = "2.11.0"
bytemuck = { version = "1.25.0", features = ["derive"] }
iced-x86 = { version = "1.21.0", default-features = false, features = [
    "no_std",
    "decoder",
    "encoder",
    "block_encoder",
] }
spin = "0.9.8"
libm = "0.2.16"

[features]
# Build the default cross-runtime plugin surface for SE and AE.
default = ["se", "ae", "prebuilt"]

# Opt-in std-backed runtime guards for plugin crates that want panic capture,
# panic-hook diagnostics, and SEH rethrow for crash loggers.
std = []

# Opt-in warning/error diagnostics for defensive SDK guards that otherwise
# return safe fallback values.
defensive-sdk-log = []

# Runtime selection flags.
se = []
ae = []
vr = []

# Opt-in default panic handler for final no_std plugin crates.
panic-handler = []

# Get the pre-built header files and libs from the URL. (zip: 160MB, Extracted: 700MB, Timeout: 30mins)
prebuilt = ["dep:reqwest", "dep:zip"]

[dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Kernel",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
]

[build-dependencies]
reqwest = { version = "0.13.4", features = ["blocking"], optional = true }
xmake = { version = "0.3.3" }
zip = { version = "8.6.0", optional = true }
